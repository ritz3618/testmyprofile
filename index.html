<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自己紹介</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>こんにちは、はじめまして</h1>


    <section>
      <h2>名前</h2>
      <p>さぶろー</p>
    </section>

    <section>
      <h2>趣味</h2>
      <p>散歩、読書</p>
      <!-- 写真を置く場所（枠だけ）。あとで <img> を入れて使う -->
      <div class="photo-frame">写真を置く場所</div>
    </section>

    <section>
      <h2>好きな食べ物</h2>
      <p>カレーライス</p>
    </section>

    <section>
      <h2>連絡先</h2>
      <!-- ダミー文：実際の連絡先に置き換えて使う -->
      <p>メールアドレスはここに</p>
    </section>
  </main>

  <!-- 訪問者数カウンター（見た目だけ。数字は固定のダミー） -->
  <footer class="counter">
    <span class="counter-label">あなたは</span>
    <span class="counter-digits" aria-label="1234人目の訪問者">
      <span class="digit">0</span><span class="digit">0</span><span class="digit">1</span><span class="digit">2</span><span class="digit">3</span><span class="digit">4</span>
    </span>
    <span class="counter-label">人目の訪問者です</span>
  </footer>
</body>
</html>
